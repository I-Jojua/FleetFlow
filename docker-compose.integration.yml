services:
  postgres-integration:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: fleetflow_test
      POSTGRES_PASSWORD: fleetflow_test_only
      POSTGRES_DB: fleetflow_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetflow_test -d fleetflow_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis-integration:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
